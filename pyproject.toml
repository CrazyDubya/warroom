[project]
name = "warroom"
version = "0.1.0"
description = "Collaborative investigation environment with AI witnesses"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.45.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
warroom = "warroom.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
